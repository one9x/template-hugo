{{ define "main" }}
  <h1>{{ .Site.Title }}</h1>
  {{ .Content }}
  <ul>
    {{ range .Site.RegularPages }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>
  <p class="note">
    Hugo writes a real HTML file per page, so this is deployed <em>without</em>
    <code>--spa</code>.
  </p>
{{ end }}
